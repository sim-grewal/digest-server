services:
  digest-server:
    build: .
    container_name: digest-server
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - kokoro

  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    container_name: kokoro
    restart: unless-stopped
    ports:
      - "8880:8880"
